# ============================================================
# Deploy TempoVibe nach Mittwald (Vite-Build, rsync über SSH)
# ============================================================
name: Deploy to Mittwald

on:
  push:
    branches:
      - main
  # Manuell (Redeploy): Actions → "Deploy to Mittwald" → Run workflow
  workflow_dispatch:

concurrency:
  group: deploy-tempo-vibe
  cancel-in-progress: false

env:
  TARGET: /home/p-yt27xz/html/tempo-vibe/
  # Instanz nicht öffentlich: Basic-Auth. Bewusst kein Secret, die Daten sind nicht schützenswert.
  BASIC_AUTH_USER: kbaumann
  BASIC_AUTH_PASSWORD: kbaumann

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Repository checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node einrichten (Vite 7 verlangt Node >= 20.19)
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Abhängigkeiten exakt nach package-lock.json
      - name: npm ci
        run: npm ci

      # 4. Typecheck (tsc -b) + Vite-Build → dist/
      #    Ein TypeScript-Fehler bricht hier ab, bevor etwas ausgeliefert wird.
      - name: Build
        run: npm run build

      # 4b. HTTP-Basic-Auth. Wird im Build erzeugt und mit dem rsync ausgeliefert —
      #     kein Zeitfenster ohne Schutz, keine Nachbearbeitung auf dem Server.
      #     dist/ ist der DocumentRoot, daher liegt .htpasswd darin und wird per
      #     <Files> zusätzlich explizit gesperrt. Hash: APR1-MD5 (openssl, von Apache unterstützt).
      #     ACME-Challenges bleiben offen, sonst scheitert die Zertifikatsverlängerung still.
      - name: Basic-Auth einrichten
        run: |
          set -euo pipefail
          printf '%s:%s\n' "$BASIC_AUTH_USER" "$(openssl passwd -apr1 "$BASIC_AUTH_PASSWORD")" > dist/.htpasswd
          cat > dist/.htaccess <<HTACCESS
          # --- Basic-Auth, beim Deploy erzeugt (.github/workflows/deploy.yml) ---
          AuthType Basic
          AuthName "TempoVibe"
          AuthUserFile ${TARGET}.htpasswd
          <RequireAny>
              Require expr "%{REQUEST_URI} =~ m#^/\.well-known/acme-challenge/#"
              Require valid-user
          </RequireAny>

          <Files ".htpasswd">
              Require all denied
          </Files>
          # --- Ende Basic-Auth ---
          HTACCESS
          cat dist/.htaccess

      # 5. Deployment via rsync über SSH — nur der Inhalt von dist/ ins Zielverzeichnis.
      #    --delete entfernt auf dem Server, was nicht im Build ist (alte Hash-Assets).
      #    Ausgeschlossene Pfade (ACME-Challenges) sind davor geschützt.
      #    .htaccess und .htpasswd kommen aus dem Build und werden bei jedem Deploy überschrieben.
      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TEMPO_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.TEMPO_SSH_HOST }}
          REMOTE_USER: ${{ secrets.TEMPO_SSH_USER }}
          REMOTE_PORT: ${{ secrets.TEMPO_SSH_PORT }}
          SOURCE: dist/
          TARGET: ${{ env.TARGET }}
          ARGS: "-rlptgoDzv --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no,-o IdentitiesOnly=yes"
          EXCLUDE: "/.well-known/"
